<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SATC — Task Tracker</title>
<meta http-equiv="refresh" content="0;url=https://script.google.com/macros/s/AKfycbzRDMqHVP72x51jRBOwa2Zfy_DhDVK_hire9KIg1eX0U779fo-wry4mat7qWM-EjHbc0w/exec">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
body{background:radial-gradient(1200px 600px at 70% -10%,#16203a 0%,#0a0e1a 55%);color:#e8edf6;
     min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:linear-gradient(180deg,#111827,#0f1626);border:1px solid #1c2c4e;border-radius:18px;
      padding:38px 34px;text-align:center;max-width:420px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.logo{display:inline-block;background:linear-gradient(135deg,#caa45a,#b08d44);color:#0a1120;font-weight:800;
      font-size:20px;letter-spacing:3px;padding:10px 20px;border-radius:11px;margin-bottom:20px}
h1{font-size:18px;font-weight:650;margin-bottom:8px}
p{color:#8b97ad;font-size:13px;line-height:1.7;margin-bottom:22px}
a{display:inline-block;background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;text-decoration:none;
  padding:11px 22px;border-radius:10px;font-size:13.5px;font-weight:600}
a:hover{filter:brightness(1.09)}
.dots{margin-top:18px;color:#5c6880;font-size:11.5px}
</style></head>
<body>
  <div class="card">
    <span class="logo">SATC</span>
    <h1>Task Tracker has moved</h1>
    <p>The tracker now runs behind Google sign-in. You will be taken there automatically — sign in with the Google account the sheet is shared with.</p>
    <a href="https://script.google.com/macros/s/AKfycbzRDMqHVP72x51jRBOwa2Zfy_DhDVK_hire9KIg1eX0U779fo-wry4mat7qWM-EjHbc0w/exec">Open Task Tracker</a>
    <div class="dots">redirecting…</div>
  </div>
</body></html>
